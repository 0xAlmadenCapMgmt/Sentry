name: build-image

# Builds the Docker image in CI and publishes it to GitHub Container Registry
# (GHCR) so no local Docker is needed. Lightsail then deploys from this image.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name must be lowercase for GHCR.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/0xalmadencapmgmt/sentry:latest
            ghcr.io/0xalmadencapmgmt/sentry:${{ github.sha }}
